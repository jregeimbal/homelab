---
# values/base/open-webui-values.yaml
replicaCount: 1
image:
  repository: ghcr.io/open-webui/open-webui
  tag: main
service:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - port: 80
      targetPort: 8080
persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn
ollama:
  enabled: false
pipelines:
  enabled: false
openaiBaseApiUrl: http://hermes-hermes-agent.jon-agent.svc.cluster.local:8642/v1
openaiApiKeyExistingSecret: open-webui-hermes-openai
openaiApiKeyExistingSecretKey: api-key
extraEnvFrom:
  - secretRef:
      name: open-webui-secret
env:
  WEBUI_DEFAULT_OPENAI_MODEL: "meta-llama/llama-3.1-8b-instruct:latest"
