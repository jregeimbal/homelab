apiServer:
  enabled: true
config:
  values:
    agent:
      gateway_timeout: 1800
      max_turns: 90
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    browser:
      allow_private_urls: false
      command_timeout: 30
      inactivity_timeout: 120
    compression:
      enabled: true
      protect_last_n: 20
      target_ratio: 0.2
      threshold: 0.5
    display:
      interim_assistant_messages: true
      tool_progress: all
    model:
      base_url: https://openrouter.ai/api/v1
      default: qwen/qwen3.6-35b-a3b
      provider: auto
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    terminal:
      backend: local
      cwd: .
      timeout: 180
    whatsapp:
      reply_prefix: "\U0001F916 *Jon R Claw*\n──────\n"
env:
  GATEWAY_ALLOW_ALL_USERS: "true"
  HERMES_GATEWAY_PLATFORM_CONNECT_TIMEOUT: "90"
  PYTHONPATH: /opt/data/py-global
  WHATSAPP_ALLOWED_USERS: "15404194480"
  WHATSAPP_ENABLED: "true"
  WHATSAPP_MODE: self-chat
extraInitContainers:
- args:
  - |
    set -eu
    PYGLOBAL=/opt/data/py-global
    if [ ! -d "$PYGLOBAL/discord" ]; then
      curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
      /usr/bin/python3 /tmp/get-pip.py --target "$PYGLOBAL" discord.py
      rm -rf /tmp/get-pip.py
    fi
  command:
  - /bin/sh
  - -ec
  image: nousresearch/hermes-agent:main
  imagePullPolicy: IfNotPresent
  name: pip-install
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
  volumeMounts:
  - mountPath: /opt/data
    name: data
  - mountPath: /tmp
    name: tmp
extraVolumeMounts:
- mountPath: /opt/hermes/scripts
  name: whatsapp-scripts
extraVolumes:
- name: whatsapp-scripts
  persistentVolumeClaim:
    claimName: hermes-ana-data
fullnameOverride: hermes-ana
image:
  tag: main
persistence:
  enabled: true
  size: 5Gi
  storageClass: longhorn
service:
  enabled: true
  ports:
  - containerPort: 8642
    name: api-server
    port: 8642
    protocol: TCP
    targetPort: 8642
