---
# Security review is now the security-review job in ci.yml, where it runs on
# PRs after all other checks pass. This file is kept for manual dispatch only.
name: Security Review (manual)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_REVIEW }}
