name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip3 install yamllint
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin

      - name: YAML lint
        run: |
          yamllint -c .yamllint \
            $(git ls-files '*.yaml' '*.yml' | grep -vE '(pre-commit-config\.yaml$|secrets/)')

      - name: K8s manifest validation
        run: |
          kubeconform -summary -ignore-missing-schemas \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/" \
            $(git ls-files 'flux/**/*.yaml')

      - name: Secret scanning
        run: |
          gitleaks detect --source . --config .gitleaks.toml --verbose

      - name: JSON lint
        run: |
          python3 -c "
          import json, glob, sys
          errors = []
          for f in glob.glob('assets/**/*.json', recursive=True):
              try:
                  with open(f) as fh:
                      json.load(fh)
              except (json.JSONDecodeError, FileNotFoundError) as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          "
