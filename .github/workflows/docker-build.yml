---
name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - assets/**
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - assets/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: hermes-agent-jregeimbal-homelab
  REGISTRY: ghcr.io
  OWNER: jregeimbal

jobs:
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.base_version.outputs.version }}
      sha: ${{ steps.git_sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get base image version
        id: base_version
        run: |
          VERSION=$(grep '^FROM ' Dockerfile | awk '{print $2}' | sed 's/.*://')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get git sha
        id: git_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.base_version.outputs.version }}-${{ steps.git_sha.outputs.sha }},enable=${{ github.event_name == 'push' }}
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Every build publishes the content-addressed sha tag (version/
          # latest/date tags stay push-only) so contract-tests can pull the
          # image on any event type, including PRs (pre-merge gate).
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contract-tests:
    name: Contract Tests (manifest replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-push]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image refs
        id: img
        run: |
          REF="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ needs.build-push.outputs.version }}-${{ needs.build-push.outputs.sha }}"
          else
            TAG="${{ needs.build-push.outputs.sha }}"
          fi
          echo "ref=${REF}${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=$(grep '^FROM ' Dockerfile | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Install helm
        run: curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Clone pinned chart
        id: chart
        run: |
          COMMIT=$(python3 -c "
          import yaml, glob
          for f in glob.glob('flux/cluster/*.yaml'):
              for d in yaml.safe_load_all(open(f)):
                  if d and d.get('kind') == 'GitRepository' and d['metadata']['name'] == 'hermes-agent':
                      print(d['spec']['ref']['commit'])")
          git clone --depth 1 https://github.com/ultraworkers/hermes-agent-helm-chart chart
          git -C chart fetch --depth 1 origin "$COMMIT"
          git -C chart checkout -q "$COMMIT"
          echo "dir=\$PWD/chart" >> "$GITHUB_OUTPUT"

      - name: Install Python deps
        run: python3 -m pip install --quiet pyyaml pytest

      - name: Run unit tests
        run: python3 -m pytest tests/ -q

      - name: Run contract tests
        run: |
          python3 scripts/manifest-contract-test.py \
            --image "${{ steps.img.outputs.ref }}" \
            --base-image "${{ steps.img.outputs.base }}" \
            --chart-dir "${{ steps.chart.outputs.dir }}" \
            --manifests flux/apps/hermes-jon.yaml flux/apps/hermes-ana.yaml flux/apps/hermes-wander.yaml \
            --survive 45 --parallel 3 --log-dir /tmp/contract-logs

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-logs
          path: /tmp/contract-logs/
          if-no-files-found: ignore

  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [build-push]
    if: github.event_name == 'push' && success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cache kubeconform
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ hashFiles('.github/workflows/docker-build.yml') }}

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin

      - name: Validate K8s manifests
        run: |
          kubeconform -summary -ignore-missing-schemas \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/" \
            flux/apps/hermes-jon.yaml \
            flux/apps/hermes-ana.yaml \
            flux/apps/hermes-wander.yaml

  validate-image:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-push]
    if: github.event_name == 'push' && success()
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify claude CLI
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.version }}-${{ needs.build-push.outputs.sha }} \
            claude --version

      - name: Verify discord package
        run: |
          docker run --rm \
            -e PYTHONPATH=/opt/data/py-global \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.version }}-${{ needs.build-push.outputs.sha }} \
            python3 -c "import discord; print(discord.__version__)"

      - name: Verify gh CLI
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.version }}-${{ needs.build-push.outputs.sha }} \
            gh --version

      - name: Verify opencode
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.version }}-${{ needs.build-push.outputs.sha }} \
            opencode --help 2>&1 | head -5

  bump-version:
    name: Bump Image Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-push, validate-manifests, validate-image]
    if: github.event_name == 'push' && success() && github.actor != 'github-actions[bot]'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get base image version
        id: version
        run: |
          set -e
          VERSION=$(grep '^FROM ' Dockerfile | awk '{print $2}' | sed 's/.*://')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Base image version: $VERSION"

      - name: Get git sha
        id: git_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update hermes-jon.yaml
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.git_sha.outputs.sha }}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:${VERSION}-${SHA}"
          IMAGE_CURRENT="ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab"
          sed -i "s|repository: ${IMAGE_CURRENT}|repository: ${IMAGE%:*}|" flux/apps/hermes-jon.yaml
          sed -i "s|image: ${IMAGE_CURRENT}.*|image: ${IMAGE}|" flux/apps/hermes-jon.yaml
          sed -i "s|tag: .*|tag: \"${IMAGE#*:}\"|" flux/apps/hermes-jon.yaml

      - name: Update hermes-ana.yaml
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.git_sha.outputs.sha }}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:${VERSION}-${SHA}"
          IMAGE_CURRENT="ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab"
          sed -i "s|repository: ${IMAGE_CURRENT}|repository: ${IMAGE%:*}|" flux/apps/hermes-ana.yaml
          sed -i "s|image: ${IMAGE_CURRENT}.*|image: ${IMAGE}|" flux/apps/hermes-ana.yaml
          sed -i "s|tag: .*|tag: \"${IMAGE#*:}\"|" flux/apps/hermes-ana.yaml

      - name: Update hermes-wander.yaml
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.git_sha.outputs.sha }}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:${VERSION}-${SHA}"
          IMAGE_CURRENT="ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab"
          sed -i "s|repository: ${IMAGE_CURRENT}|repository: ${IMAGE%:*}|" flux/apps/hermes-wander.yaml
          sed -i "s|image: ${IMAGE_CURRENT}.*|image: ${IMAGE}|" flux/apps/hermes-wander.yaml
          sed -i "s|tag: .*|tag: \"${IMAGE#*:}\"|" flux/apps/hermes-wander.yaml

      - name: Commit and push manifest updates
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flux/apps/hermes-jon.yaml flux/apps/hermes-ana.yaml flux/apps/hermes-wander.yaml
          git commit -m "chore: bump hermes image to ${VERSION}-${{ steps.git_sha.outputs.sha }}" || echo "No changes to commit"
          git push --force-with-lease 2>&1 || { echo "Git push failed - check for conflicts"; exit 1; }
