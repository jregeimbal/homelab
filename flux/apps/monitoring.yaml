---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus
      version: "29.8.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  releaseName: prometheus
  targetNamespace: monitoring
  values:
    server:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            resources:
              requests:
                storage: 5Gi
    prometheus-node-exporter:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 5m
  releaseName: grafana
  targetNamespace: monitoring
  dependsOn:
    - name: prometheus
  values:
    adminPassword: admin
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    service:
      type: ClusterIP  # exposed through the Tailscale Ingress below (HTTPS)
      ports:
        - port: 80
          targetPort: 3000
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: prometheus
            type: prometheus
            url: http://prometheus-server.monitoring.svc.cluster.local
            access: proxy
            isDefault: true
    fullnameOverride: grafana
    # SSO through authentik (OIDC). Members of `authentik Admins` get the Grafana Admin role, everyone
    # else Viewer. The local admin login stays enabled as a fallback.
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
    grafana.ini:
      server:
        root_url: https://grafana.hartley-gray.ts.net
      auth:
        signout_redirect_url: https://authentik.hartley-gray.ts.net/application/o/grafana/end-session/
      auth.generic_oauth:
        enabled: true
        name: authentik
        client_id: grafana
        scopes: openid profile email
        auth_url: https://authentik.hartley-gray.ts.net/application/o/authorize/
        token_url: https://authentik.hartley-gray.ts.net/application/o/token/
        api_url: https://authentik.hartley-gray.ts.net/application/o/userinfo/
        use_pkce: true
        allow_sign_up: true
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email
        role_attribute_path: contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
---
# Tailnet only, with a Let's Encrypt cert issued by Tailscale: https://grafana.hartley-gray.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana
      port:
        number: 80
  tls:
    - hosts:
        - grafana
