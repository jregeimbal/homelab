---
# Sofarmap (github.com/jregeimbal/sofarmap, private): printable maps of Jon's travels.
# PostGIS, and the app (Go API + React UI + render workers) on the tailnet behind authentik SSO.
# Images are private on GHCR: pulled with `ghcr-pull`.
# Secrets: sofarmap-secrets (Postgres password and DB URL, session and token-encryption keys, the
# authentik client secret, and the Google Maps / OpenRouteService keys for the map editor).

# ---------------------------------------------------------------- PostGIS
# Built from the repo's db/Dockerfile (postgres:18 + PostGIS) for amd64 and arm64.
apiVersion: v1
kind: Service
metadata:
  name: sofarmap-postgres
  namespace: sofarmap
spec:
  selector:
    app.kubernetes.io/name: sofarmap-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sofarmap-postgres
  namespace: sofarmap
spec:
  serviceName: sofarmap-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sofarmap-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sofarmap-postgres
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ghcr.io/jregeimbal/sofarmap-db:18-postgis3
          args:
            - -c
            - shared_buffers=256MB
            - -c
            - work_mem=32MB
            - -c
            - max_wal_size=1GB
          env:
            - name: POSTGRES_USER
              value: sofarmap
            - name: POSTGRES_DB
              value: sofarmap
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sofarmap-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sofarmap", "-d", "sofarmap"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sofarmap", "-d", "sofarmap"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Postgres 18+ images declare VOLUME /var/lib/postgresql (data lives in 18/docker under it);
            # mounting .../data instead would silently write to an anonymous volume.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi

# ---------------------------------------------------------------- App
---
# Uploaded history exports and rendered posters.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sofarmap-data
  namespace: sofarmap
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sofarmap
  namespace: sofarmap
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO data volume
  selector:
    matchLabels:
      app.kubernetes.io/name: sofarmap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sofarmap
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: 65532  # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jregeimbal/sofarmap:202610170935_02e4ca1
          env:
            - name: ADDR
              value: ":8080"
            - name: PUBLIC_URL
              value: https://sofarmap.hartley-gray.ts.net
            # Sign-in is authentik only (Google sign-in stays off: no GOOGLE_CLIENT_ID). Access is limited to
            # the `sofarmap-users` group. authentik sends email_verified=false, so its email is trusted
            # explicitly; accounts are still linked only after the person proves ownership of the first one.
            - name: OIDC_ISSUER
              value: https://authentik.hartley-gray.ts.net/application/o/sofarmap/
            - name: OIDC_CLIENT_ID
              value: sofarmap
            - name: OIDC_NAME
              value: authentik
            - name: OIDC_ALLOWED_GROUPS
              value: sofarmap-users
            - name: OIDC_TRUST_EMAIL
              value: "1"
            # PNG exports peak around 17 bytes/pixel: 120 MP is about 2 GB, under the memory limit.
            - name: MAX_RASTER_MEGAPIXELS
              value: "120"
            - name: RENDER_WORKERS
              value: "1"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: DATABASE_URL } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: SESSION_SECRET } }
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: TOKEN_ENCRYPTION_KEY } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: OIDC_CLIENT_SECRET } }
            - name: GOOGLE_MAPS_API_KEY
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: GOOGLE_MAPS_API_KEY } }
            - name: ORS_API_KEY
              valueFrom: { secretKeyRef: { name: sofarmap-secrets, key: ORS_API_KEY } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/sofarmap
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sofarmap-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sofarmap
  namespace: sofarmap
spec:
  type: ClusterIP  # exposed through the Tailscale Ingress below (HTTPS)
  selector:
    app.kubernetes.io/name: sofarmap
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Tailnet only, with a Let's Encrypt cert issued by Tailscale: https://sofarmap.hartley-gray.ts.net
# (the OIDC redirect and secure cookies need HTTPS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sofarmap
  namespace: sofarmap
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: sofarmap
      port:
        number: 80
  tls:
    - hosts:
        - sofarmap
