---
# Authentik identity provider (goauthentik.io): SSO/OIDC for the homelab apps.
# Our own Postgres 18 (the chart's bundled Bitnami Postgres is disabled), the authentik server and
# worker from the official chart, and a Tailscale Ingress so it gets a real TLS cert at
# https://authentik.hartley-gray.ts.net (OIDC redirects and secure cookies need HTTPS).
# Secrets: authentik-secrets (AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__PASSWORD, and
# AUTHENTIK_BOOTSTRAP_PASSWORD, the first-run password for the `akadmin` user).

# ---------------------------------------------------------------- Postgres
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: authentik-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18
          args:
            - -c
            - shared_buffers=128MB
          env:
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Postgres 18+ images declare VOLUME /var/lib/postgresql (data lives in 18/docker under it);
            # mounting .../data instead would silently write to an anonymous volume.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

# ---------------------------------------------------------------- authentik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  # First install and upgrades run Django migrations before the pods turn ready, which takes well
  # over Helm's default 5m on the SO Quartz nodes; a timeout uninstalls mid-migration.
  timeout: 20m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 5m
  releaseName: authentik
  targetNamespace: authentik
  values:
    authentik:
      # Secret values come from authentik-secrets (envFrom on server and worker); with existingSecret
      # set, the chart ignores authentik.* values, so the non-secret config lives in global.env.
      existingSecret:
        secretName: authentik-secrets
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgres.authentik.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
    server:
      startupProbe:
        failureThreshold: 120  # 20m at the 10s period, to match the Helm timeout
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
    worker:
      envFrom:
        - secretRef:
            name: authentik-oidc-clients  # client secrets for the SSO blueprint (!Env)
      startupProbe:
        failureThreshold: 120  # 20m at the 10s period, to match the Helm timeout
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1536Mi
    blueprints:
      configMaps:
        - authentik-blueprint-sso
    postgresql:
      enabled: false
  # The chart doesn't expose progressDeadlineSeconds. At the default 600s, Helm marks the Deployments
  # Failed while migrations are still running, ignoring the 20m timeout, and the uninstall that follows
  # leaves the migration history inconsistent.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: authentik-(server|worker)
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 1800
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
---
# Tailnet only, with a Let's Encrypt cert issued by Tailscale: https://authentik.hartley-gray.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: authentik
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: authentik-server
      port:
        number: 80
  tls:
    - hosts:
        - authentik
---
# SSO apps, applied by the authentik worker as a blueprint (re-applied on change). Client secrets come
# from authentik-oidc-clients via !Env; the same values are sealed into each app's namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-sso
  namespace: authentik
data:
  sso-apps.yaml: |
    version: 1
    metadata:
      name: homelab-sso-apps
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: Grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.hartley-gray.ts.net/login/generic_oauth
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.hartley-gray.ts.net/
      - model: authentik_providers_oauth2.oauth2provider
        id: open-webui-provider
        identifiers:
          name: Open WebUI
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: open-webui
          client_secret: !Env OPEN_WEBUI_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://open-webui.hartley-gray.ts.net/oauth/oidc/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !KeyOf open-webui-provider
          meta_launch_url: https://open-webui.hartley-gray.ts.net/
