---
apiVersion: v1
kind: Service
metadata:
  name: hermes-wander-tailscale
  namespace: wander-agent
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: hermes-wander
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: api-server
      port: 8642
      targetPort: 8642
    - name: webui
      port: 8787
      targetPort: 8787
    - name: desktop
      port: 9119
      targetPort: 9119
