---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-ana
  namespace: ana-agent
spec:
  interval: 5m
  chart:
    spec:
      chart: .
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: hermes-agent
        namespace: flux-system
      interval: 5m
  releaseName: hermes-ana
  targetNamespace: ana-agent
  values:
    apiServer:
      enabled: true
    secrets:
      existingSecret: hermes-ana-secrets
    config:
      values:
        agent:
          gateway_timeout: 1800
          max_turns: 90
          restart_drain_timeout: 60
          tool_use_enforcement: true
        browser:
          allow_private_urls: false
          command_timeout: 60
          inactivity_timeout: 120
        display:
          interim_assistant_messages: true
          tool_progress: all
        model:
          base_url: http://jonathans-mac-studio:8000/v1
          default: mtplx-qwen38-27b-optimized-quality
          provider: custom
          api_key: "superduper"
        security:
          redact_secrets: true
          tirith_enabled: true
          tirith_fail_open: true
        stt:
          enabled: true
        terminal:
          backend: local
          cwd: .
          timeout: 180
        whatsapp:
          reply_prefix: "\U0001F916 *Ana's Agent*\n──────\n"
    env:
      BROWSER_CDP_URL: ws://127.0.0.1:3000/
      GATEWAY_ALLOW_ALL_USERS: "false"
      HERMES_GATEWAY_PLATFORM_CONNECT_TIMEOUT: "90"
      PYTHONPATH: /opt/data/py-global
      WHATSAPP_ALLOWED_USERS: "15404194480"
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: self-chat
    extraContainers:
      - image: ghcr.io/browserless/chromium:latest
        imagePullPolicy: Always
        name: browserless-chromium
        ports:
          - containerPort: 3000
            name: cdp
            protocol: TCP
          - containerPort: 8080
            name: http
            protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
    extraInitContainers:
      - args:
          - |
            set -eu
            chown -R 10000:10000 /opt/data
            chown 10000:10000 /mnt/run
        command:
          - /bin/sh
          - -ec
        image: ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab:v2026.7.30-3b37901
        imagePullPolicy: IfNotPresent
        name: fix-data-ownership
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /opt/data
            name: data
          - mountPath: /tmp
            name: tmp
          - mountPath: /mnt/run
            name: run-tmp
    extraVolumeMounts:
      - mountPath: /run
        name: run-tmp
      - mountPath: /opt/hermes/scripts
        name: whatsapp-scripts
    extraVolumes:
      - name: run-tmp
        emptyDir: {}
      - name: whatsapp-scripts
        persistentVolumeClaim:
          claimName: hermes-ana-data
    fullnameOverride: hermes-ana
    image:
      repository: ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab
      tag: "v2026.7.30-3b37901"
      pullPolicy: IfNotPresent
    podSecurityContext:
      fsGroup: 10000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 10000
      runAsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn
    service:
      enabled: true
      ports:
        - containerPort: 8642
          name: api-server
          port: 8642
          protocol: TCP
          targetPort: 8642
        - containerPort: 9119
          name: desktop
          port: 9119
          protocol: TCP
          targetPort: 9119
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
