---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: jon-agent
spec:
  interval: 5m
  chart:
    spec:
      chart: .
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: hermes-agent
        namespace: flux-system
      interval: 5m
  releaseName: hermes
  targetNamespace: jon-agent
  values:
    apiServer:
      enabled: true
    secrets:
      existingSecret: hermes-jon-secrets
    config:
      values:
        model:
          base_url: http://192.168.1.224:1234/v1
          default: qwen/qwen3.6-35b-a3b
          provider: auto
        whatsapp:
          reply_prefix: "\U0001F916 *Jon R Claw*\n──────\n"
    env:
      DISCORD_ALLOWED_USERS: "808110923713216522"
      DISCORD_HOME_CHANNEL: "1490811659214913698"
      GATEWAY_ALLOW_ALL_USERS: "false"
      HERMES_GATEWAY_PLATFORM_CONNECT_TIMEOUT: "90"
      PYTHONPATH: /opt/data/py-global
      TELEGRAM_ALLOWED_USERS: "8238305614"
      TELEGRAM_HOME_CHANNEL: "-1003912742246"
      WHATSAPP_ALLOWED_USERS: "15409075116"
      WHATSAPP_DEBUG: "true"
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: self-chat
    extraInitContainers:
      - args:
          - |
            set -eu
            PYGLOBAL=/opt/data/py-global
            if [ ! -d "$PYGLOBAL/discord" ]; then
              curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
              /usr/bin/python3 /tmp/get-pip.py --target "$PYGLOBAL" discord.py
              rm -rf /tmp/get-pip.py
            fi
        command:
          - /bin/sh
          - -ec
        image: nousresearch/hermes-agent:main
        imagePullPolicy: IfNotPresent
        name: pip-install
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - mountPath: /opt/data
            name: data
          - mountPath: /tmp
            name: tmp
    extraVolumeMounts:
      - mountPath: /opt/hermes/scripts
        name: whatsapp-scripts
    extraVolumes:
      - name: whatsapp-scripts
        persistentVolumeClaim:
          claimName: hermes-hermes-agent-data
    image:
      tag: main
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn
    service:
      enabled: true
      ports:
        - containerPort: 8642
          name: api-server
          port: 8642
          protocol: TCP
          targetPort: 8642
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
