---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: jon-agent
spec:
  interval: 5m
  chart:
    spec:
      chart: .
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: hermes-agent
        namespace: flux-system
      interval: 5m
  releaseName: hermes
  targetNamespace: jon-agent
  values:
    apiServer:
      enabled: true
    secrets:
      existingSecret: hermes-jon-secrets
    config:
      values:
        agent:
          gateway_timeout: 1800
          max_turns: 90
          restart_drain_timeout: 60
          tool_use_enforcement: true
        browser:
          allow_private_urls: false
          command_timeout: 60
          inactivity_timeout: 120
        display:
          interim_assistant_messages: true
          tool_progress: all
        model:
          base_url: http://jonathans-mac-studio:1234/v1
          default: qwen/qwen3.6-35b-a3b
          provider: custom
        security:
          redact_secrets: true
          tirith_enabled: true
          tirith_fail_open: true
        stt:
          enabled: true
        terminal:
          backend: local
          cwd: .
          timeout: 180
        whatsapp:
          reply_prefix: "\U0001F916 *Jon R Claw*\n──────\n"
        web:
          backend: firecrawl
      skills:
        disabled:
          - yuanbao
          - codex
          - kanban-codex-lane
          - baoyu-article-illustrator
          - baoyu-comic
          - baoyu-infographic
          - comfyui
          - p5js
          - pixel-art
          - touchdesigner-mcp
          - jupyter-live-kernel
          - himalaya
          - minecraft-modpack-server
          - pokemon-player
          - spotify
          - youtube-content
          - audiocraft-audio-generation
          - segment-anything-model
          - serving-llms-vllm
          - airtable
          - notion
          - powerpoint
          - teams-meeting-pipeline
          - godmode
          - openhue
          - xurl
    env:
      ANTHROPIC_AUTH_TOKEN: lmstudio
      ANTHROPIC_BASE_URL: http://jonathans-mac-studio:1234
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      BROWSER_CDP_URL: ws://127.0.0.1:3000/
      DISCORD_ALLOWED_USERS: "808110923713216522"
      DISCORD_HOME_CHANNEL: "1490811659214913698"
      GATEWAY_ALLOW_ALL_USERS: "false"
      HERMES_GATEWAY_PLATFORM_CONNECT_TIMEOUT: "90"
      PATH: /root/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /opt/data/py-global
      TELEGRAM_ALLOWED_USERS: "8238305614"
      TELEGRAM_HOME_CHANNEL: "-1003912742246"
      WHATSAPP_ALLOWED_USERS: "15409075116"
      WHATSAPP_DEBUG: "true"
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: self-chat
    extraContainers:
      - image: ghcr.io/browserless/chromium:latest
        imagePullPolicy: Always
        name: browserless-chromium
        ports:
          - containerPort: 3000
            name: cdp
            protocol: TCP
          - containerPort: 8080
            name: http
            protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
      - image: ghcr.io/nesquena/hermes-webui:latest
        imagePullPolicy: Always
        name: hermes-webui
        ports:
          - containerPort: 8787
            name: webui
            protocol: TCP
        env:
          - name: PATH
            value: /root/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          - name: HERMES_WEBUI_HOST
            value: "0.0.0.0"
          - name: HERMES_WEBUI_PORT
            value: "8787"
          - name: HERMES_WEBUI_CHAT_BACKEND
            value: gateway
          - name: HERMES_WEBUI_GATEWAY_BASE_URL
            value: http://127.0.0.1:8642
          - name: HERMES_WEBUI_GATEWAY_API_KEY
            valueFrom:
              secretKeyRef:
                name: hermes-jon-secrets
                key: API_SERVER_KEY
          - name: HERMES_WEBUI_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hermes-webui-password
                key: password
          - name: HERMES_WEBUI_STATE_DIR
            value: /home/hermeswebui/.hermes/webui
          - name: HERMES_HOME
            value: /opt/data
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /opt/data
            name: data
          - name: hermes-agent-source
            mountPath: /opt/hermes
            readOnly: true
          - name: workspace
            mountPath: /workspace
    extraInitContainers:
      - args:
          - |
            set -eu
            rm -rf /shared-hermes-agent/*
            cp -a /opt/hermes/. /shared-hermes-agent/
            chown -R 1024:1024 /shared-hermes-agent
        command:
          - /bin/sh
          - -ec
        image: ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab:v2026.5.29.2
        imagePullPolicy: IfNotPresent
        name: copy-hermes-source
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /shared-hermes-agent
            name: hermes-agent-source
          - mountPath: /tmp
            name: tmp
      - args:
          - |
            set -eu
            chown -R 10000:10000 /opt/data
        command:
          - /bin/sh
          - -ec
        image: ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab:v2026.5.29.2
        imagePullPolicy: IfNotPresent
        name: fix-data-ownership
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /opt/data
            name: data
          - mountPath: /tmp
            name: tmp
    extraVolumeMounts:
      - mountPath: /run
        name: run-tmp
    image:
      repository: ghcr.io/jregeimbal/hermes-agent-jregeimbal-homelab
      tag: v2026.5.29.2
      pullPolicy: IfNotPresent
    podSecurityContext:
      fsGroup: 0
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn
    extraVolumes:
      - name: run-tmp
        emptyDir: {}
      - name: hermes-agent-source
        emptyDir: {}
      - name: workspace
        persistentVolumeClaim:
          claimName: hermes-webui-workspace
    service:
      enabled: true
      ports:
        - containerPort: 8642
          name: api-server
          port: 8642
          protocol: TCP
          targetPort: 8642
        - containerPort: 8787
          name: webui
          port: 8787
          protocol: TCP
          targetPort: 8787
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hermes-hermes-agent
            patch: |
              - op: remove
                path: /spec/template/spec/containers/0/securityContext/capabilities
