---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 5m
  chart:
    spec:
      chart: open-webui
      version: "14.6.0"
      sourceRef:
        kind: HelmRepository
        name: openwebui
        namespace: flux-system
      interval: 5m
  releaseName: open-webui
  targetNamespace: open-webui
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: main
    service:
      type: LoadBalancer
      ports:
        - port: 80
          targetPort: 8080
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    env:
      OLLAMA_BASE_URL: "http://hermes-agent.jon-agent.svc.cluster.local:5000"
      WEBUI_SECRET_KEY: "changeme-in-production"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
