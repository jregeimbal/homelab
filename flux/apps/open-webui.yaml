---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 5m
  chart:
    spec:
      chart: open-webui
      version: "14.6.0"
      sourceRef:
        kind: HelmRepository
        name: openwebui
        namespace: flux-system
      interval: 5m
  releaseName: open-webui
  targetNamespace: open-webui
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: main
    service:
      type: ClusterIP  # exposed through the Tailscale Ingress below (HTTPS)
      ports:
        - port: 80
          targetPort: 8080
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    ollama:
      enabled: false
    pipelines:
      enabled: false
    openaiBaseApiUrl: http://hermes-hermes-agent.jon-agent.svc.cluster.local:8642/v1
    openaiApiKeyExistingSecret: open-webui-secret
    openaiApiKeyExistingSecretKey: api-key
    extraEnvFrom:
      - secretRef:
          name: open-webui-secret
    # SSO through authentik (OIDC). Accounts are keyed to the OIDC subject, not email: merging by email
    # would let anyone who can change their authentik email take over another account (authentik always
    # sends email_verified=false). The first account becomes admin; later ones land as `pending`.
    sso:
      enabled: true
      enableSignup: true
      mergeAccountsByEmail: false
      oidc:
        enabled: true
        providerName: authentik
        providerUrl: https://authentik.hartley-gray.ts.net/application/o/open-webui/.well-known/openid-configuration
        clientId: open-webui
        clientExistingSecret: open-webui-oidc
        clientExistingSecretKey: client-secret
        scopes: openid email profile
    extraEnvVars:
      - name: OPENID_REDIRECT_URI
        value: https://open-webui.hartley-gray.ts.net/oauth/oidc/callback
    env:
      WEBUI_DEFAULT_OPENAI_MODEL: "meta-llama/llama-3.1-8b-instruct:latest"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
---
# Tailnet only, with a Let's Encrypt cert issued by Tailscale: https://open-webui.hartley-gray.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: open-webui
      port:
        number: 80
  tls:
    - hosts:
        - open-webui
