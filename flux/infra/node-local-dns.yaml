---
# NodeLocal DNSCache — eliminates the conntrack UDP race condition that causes
# intermittent DNS timeouts in pods. Runs CoreDNS on every node via hostNetwork,
# bound to 169.254.20.10 (link-local).
#
# Two init containers set up the host networking before CoreDNS starts:
#   1. setup-address:  puts 169.254.20.10/32 on "nodelocaldns", an empty bridge
#                      that exists only to hold it (LOCAL routing table)
#   2. setup-iptables: DNATs pod DNS traffic (10.96.0.10:53 → 169.254.20.10:53)
#                      in PREROUTING only — NOT OUTPUT, which would loop CoreDNS's
#                      own upstream forwarding back to itself.
#
# Pods keep nameserver 10.96.0.10 in resolv.conf (no kubelet change needed);
# iptables transparently redirects to the local cache on every node.
# cluster.local queries forward to CoreDNS via TCP (force_tcp removes the
# conntrack race on the cache→CoreDNS leg). External queries go to the node's
# systemd-resolved stub (127.0.0.53, reachable because this runs on the host network),
# which sends tailnet names to Tailscale and everything else to the router; see
# scripts/set-node-dns.sh. A node without resolved refuses 127.0.0.53, so the cache
# falls back to 100.100.100.100 (Tailscale MagicDNS) there, as before.
#
# Note: not on lo. k0s picks its API address, when started without one, as the
# first non-127.x IPv4 address in interface order, and lo comes first: a
# controller restarted while this was on lo advertised 169.254.20.10, and the
# workers' kube-proxy lost the API (2026-10-15). The bridge is created after
# boot, so it sorts after eth0 on every node, controllers included.
#
# Note: a bridge, not a dummy interface as upstream NodeLocal DNSCache uses: these
# kernels are built without dummy support (CONFIG_DUMMY), which is likely also why
# k8s-dns-node-cache's dummy-interface setup failed when it was tried. This uses
# plain CoreDNS v1.14.2 instead of that wrapper binary.
#
# Note: k0s forbids setting clusterDNS in workerProfiles (it computes it from
# serviceCIDR). The iptables DNAT approach is used instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10:53 {
            force_tcp
        }
        prometheus :9253
        health 169.254.20.10:9091
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10:53 {
            force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10:53 {
            force_tcp
        }
        prometheus :9253
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        forward . 127.0.0.53 100.100.100.100 {
            policy sequential
        }
        prometheus :9253
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        # The Corefile is mounted with subPath, which never sees ConfigMap updates:
        # bump this when it changes so the pods restart with it.
        homelab/corefile-revision: "2"
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: setup-address
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              # Earlier versions put the address on lo; take it off there.
              ip addr del 169.254.20.10/32 dev lo 2>/dev/null
              ip link show nodelocaldns >/dev/null 2>&1 || ip link add nodelocaldns type bridge
              ip addr del 169.254.20.10/32 dev nodelocaldns 2>/dev/null
              ip addr add 169.254.20.10/32 dev nodelocaldns
              ip link set nodelocaldns up
          securityContext:
            privileged: true
        - name: setup-iptables
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              apk add -q iptables
              # Remove stale rules from any previous pod on this node
              iptables -t nat -D PREROUTING -p udp --dport 53 -d 10.96.0.10 -j DNAT --to-destination 169.254.20.10 2>/dev/null
              iptables -t nat -D PREROUTING -p tcp --dport 53 -d 10.96.0.10 -j DNAT --to-destination 169.254.20.10 2>/dev/null
              # Add DNAT rules before kube-proxy's KUBE-SERVICES chain
              iptables -t nat -I PREROUTING 1 -p udp --dport 53 -d 10.96.0.10 -j DNAT --to-destination 169.254.20.10
              iptables -t nat -I PREROUTING 1 -p tcp --dport 53 -d 10.96.0.10 -j DNAT --to-destination 169.254.20.10
          securityContext:
            privileged: true
      containers:
        - name: node-cache
          image: registry.k8s.io/coredns/coredns:v1.14.2
          args:
            - "-conf"
            - "/etc/Corefile"
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9253
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              host: 169.254.20.10
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              host: 169.254.20.10
              path: /health
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 5Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - mountPath: /etc/Corefile
              name: config-volume
              subPath: Corefile
      volumes:
        - name: config-volume
          configMap:
            name: node-local-dns
            items:
              - key: Corefile
                path: Corefile
